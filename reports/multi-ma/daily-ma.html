<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading System V2 · Daily MA 운영 Dashboard</title>
<style>
:root{font-family:system-ui,sans-serif;color:#17212b;background:#eef2f6}body{margin:18px auto;max-width:1800px;background:#fff;padding:20px;border-radius:12px}h1{margin:0 0 8px;font-size:1.45rem}.muted{color:#657483}.controls,.summary{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.controls button{border:1px solid #9caab8;background:#fff;padding:7px 11px;border-radius:7px;cursor:pointer}.controls button.active{background:#1f5f99;color:#fff}.card{border:1px solid #d6dee7;border-radius:8px;padding:9px 12px;background:#f8fafc;min-width:125px}.card b{display:block;font-size:1.15rem}.scroll{overflow:auto;border:1px solid #d6dee7;border-radius:8px;max-height:68vh}table{border-collapse:collapse;width:100%;font-size:.78rem}th,td{border-bottom:1px solid #e2e8f0;padding:7px;text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#f2f6fa;z-index:1}th:first-child,td:first-child,td:nth-child(2),td:nth-child(3){text-align:left}.activity-30{background:#f5faf2}.activity-7{background:#ecf7df}.activity-today{background:#d8f0bb}.risk{color:#b42318;font-weight:700}.signal{font-weight:700}.near{color:#a15c00}.open{color:#14532d}.detail{border:1px solid #cbd5e1;border-radius:8px;margin-top:12px;padding:13px}.detail[hidden]{display:none}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.detail table{font-size:.75rem}.empty{padding:12px;color:#64748b}a{color:#145a8d}@media(max-width:700px){body{margin:0;border-radius:0;padding:11px}.summary{display:grid;grid-template-columns:repeat(2,1fr)}}
</style>
<body>
<h1>Daily MA 통합 운영·성과 Dashboard</h1>
<p class="muted">읽기 전용 관찰 화면입니다. 일봉 확정 신호는 기존 Runtime event만 표시하며, 근접도·분봉 값은 관찰 telemetry입니다.</p>
<div class="controls"><button data-universe="ALL" class="active">전체 2,400</button><button data-universe="SELECTED">SELECTED 346</button><button data-universe="LIVE">LIVE 346</button><span id="updated" class="muted"></span></div>
<div id="summary" class="summary"></div>
<div class="scroll"><table><thead><tr>
<th>전략</th><th>신호/실행</th><th>진입·청산·추세</th><th>선정</th><th>운용</th><th>복리자본</th><th>Risk</th><th>실적 (+)<br>완료/복리/승률</th><th class="aug">8월 이후<br>완료/복리/승률</th><th>오늘 일봉</th><th>일봉 근접도<br>진입/청산</th><th>1MIN telemetry<br>진입/청산</th><th>활동</th><th>LIVE 상태</th><th>상세</th>
</tr></thead><tbody id="rows"></tbody></table></div>
<section id="detail" class="detail" hidden><button onclick="document.querySelector('#detail').hidden=true">닫기</button><div id="detailBody"></div></section>
<script>
const $=q=>document.querySelector(q), n=v=>v==null?'–':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2}), pct=v=>v==null?'–':n(v)+'%', date=v=>v?String(v).slice(0,10):'–'; let universe='ALL';
function esc(v){return String(v??'–').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function signalClass(v){return /NEAR/.test(v)?'near':/OPEN|FILLED|CLOSED/.test(v)?'open':'signal'}
function activity(row){return row.today_closed_count?'activity-today':row.trailing_7d_closed_count?'activity-7':row.trailing_30d_closed_count?'activity-30':''}
function summary(s){const fields=[['PAPER 추적',s.paper_tracking_strategies],['LIVE',s.live_strategies],['3 STRIKE 정지',s.three_strike_suspended],['오늘 DAILY ENTRY',s.daily_entry_signals],['오늘 DAILY EXIT',s.daily_exit_signals],['오늘 1MIN ENTRY',s.minute_entry_signals],['오늘 1MIN EXIT',s.minute_exit_signals],['오늘 주문/체결',`${s.actual_orders_today}/${s.fills_today}`],['현금 skip',s.cash_skips_today],['UNKNOWN',s.unknown_count],['Recon 차단',s.reconciliation_blocked_count],['오늘 CLOSED',s.closed_today]];$('#summary').innerHTML=fields.map(([k,v])=>`<div class="card"><span>${k}</span><b>${n(v)}</b></div>`).join('')}
function render(data){summary(data.summary);$('#updated').textContent='조회: '+new Date(data.generated_at).toLocaleString('ko-KR');$('#rows').innerHTML=data.rows.map(row=>{let p=row.daily_proximity||{},m=row.minute_telemetry||{},risk=row.live_risk_status==='THREE_STRIKE_SUSPENDED'?'risk':'';return `<tr class="${activity(row)}"><td>${esc(row.strategy_id)}<br>${esc(row.strategy_name)}</td><td>${esc(row.signal_code)} → ${esc(row.execution_code)}<br>${esc(row.direction)}</td><td>${row.entry_fast_ma}/${row.entry_slow_ma} · ${row.exit_fast_ma}/${row.exit_slow_ma} · ${row.trend_ma??'NONE'}</td><td>${esc(row.selection_tier||'NONE')}</td><td>${esc(row.operation_status)}</td><td>${n(row.strategy_compound_capital)}</td><td class="${risk}">${esc(row.live_risk_status)}<br>${row.consecutive_loss_count} 연속손실</td><td>${row.actual_completed_trade_count} / ${pct(row.actual_compound_return_pct)} / ${pct(row.actual_win_rate)}</td><td class="aug">${row.aug_completed_trade_count} / ${pct(row.aug_compound_return_pct)} / ${pct(row.aug_win_rate)}</td><td class="${signalClass(row.today_signal_status)}">${esc(row.today_signal_status)}</td><td>${pct(p.entry_gap_pct)} / ${pct(p.exit_gap_pct)}<br>${p.trend_filter_pass==null?'–':p.trend_filter_pass?'trend PASS':'trend FAIL'}</td><td>${m.minute_entry_signal_count??0} / ${m.minute_exit_signal_count??0}<br>${pct(m.minute_entry_gap_pct)} / ${pct(m.minute_exit_gap_pct)}</td><td>${date(row.latest_closed_date)}<br>30d ${row.trailing_30d_closed_count} · 7d ${row.trailing_7d_closed_count} · 오늘 ${row.today_closed_count}</td><td>OPEN L/P ${row.open_live_trade_count}/${row.open_paper_trade_count}<br>주문/체결 ${row.today_order_count}/${row.today_fill_count}<br>${row.cash_skip_today?'CASH SKIP ':''}${row.unknown_count?'UNKNOWN ':''}${row.reconciliation_blocked?'RECON BLOCK':''}</td><td><button onclick="detail('${esc(row.strategy_id)}')">보기</button></td></tr>`}).join('')||'<tr><td colspan="15" class="empty">표시할 전략이 없습니다.</td></tr>'}
async function load(){let response=await fetch('/daily-ma/api/dashboard?universe='+universe,{cache:'no-store'}),data=await response.json();if(data.status!=='OK')throw Error(data.error||'dashboard failed');render(data)}
async function detail(id){let response=await fetch('/daily-ma/api/detail?strategy_id='+encodeURIComponent(id),{cache:'no-store'}),d=await response.json();if(d.status==='ERROR')throw Error(d.error);let table=(title,rows)=>`<section><h3>${title}</h3>${rows.length?'<div class="scroll"><table><thead><tr>'+Object.keys(rows[0]).map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+Object.values(r).map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<p class="empty">없음</p>'}</section>`;$('#detailBody').innerHTML=`<h2>${esc(id)}</h2><div class="detail-grid">${table('PAPER 실제상품 거래',d.paper_actual)}${table('LIVE 실제거래',d.live)}${table('Historical',d.historical)}</div>`;$('#detail').hidden=false;$('#detail').scrollIntoView({behavior:'smooth'})}
document.querySelectorAll('[data-universe]').forEach(button=>button.onclick=async()=>{universe=button.dataset.universe;document.querySelectorAll('[data-universe]').forEach(x=>x.classList.toggle('active',x===button));try{await load()}catch(e){$('#rows').innerHTML='<tr><td colspan="15" class="empty">조회 오류: '+esc(e.message)+'</td></tr>'}});load().catch(e=>$('#rows').innerHTML='<tr><td colspan="15" class="empty">조회 오류: '+esc(e.message)+'</td></tr>');
</script></body></html>
