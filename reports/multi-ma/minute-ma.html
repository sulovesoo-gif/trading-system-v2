<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minute MA 연구·운영 Dashboard</title>
  <style>
    body{font:13px system-ui;margin:0;background:#f5f7fb;color:#172033}.top{position:sticky;top:0;background:#fff;padding:10px 12px;border-bottom:1px solid #dce2ec;z-index:3}
    h2{margin:2px 0 8px;font-size:18px}.controls,.cards,.pager{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.card{background:#eef3ff;border-radius:8px;padding:7px 9px}
    button,select,input{min-height:34px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;padding:4px 8px}.active{background:#175cd3;color:#fff}.danger{background:#fee4e2;color:#b42318}.good{background:#dcfae6;color:#067647}
    .wrap{padding:10px 12px}.table{overflow:auto;background:#fff;border-radius:8px;max-height:67vh}table{border-collapse:collapse;width:100%}
    th,td{padding:6px 8px;border-bottom:1px solid #e5e9f0;white-space:nowrap;text-align:right}th{position:sticky;top:0;background:#1f3155;color:#fff}td:first-child,th:first-child{text-align:left}
    .muted{color:#687386}.error{color:#b42318}.live{font-weight:700;color:#b54708}.positive{color:#067647}.negative{color:#b42318}.link{cursor:pointer;color:#175cd3}.hidden{display:none!important}
    .pager{justify-content:center;margin:10px}.collapsed{padding:14px;background:#fff;border-radius:8px}.loading{opacity:.6;pointer-events:none}.help{cursor:help;border-bottom:1px dotted #fff}
    dialog{width:min(1500px,95vw);max-height:90vh;border:0;border-radius:10px;padding:0}dialog header{position:sticky;top:0;background:#fff;padding:12px;border-bottom:1px solid #ddd}
    dialog section{padding:12px}.detail-table{overflow:auto}.detail-table table{min-width:1300px}.section-empty{color:#667085;padding:12px;background:#f9fafb}
    #v1Section .table{overflow-x:hidden}#v1Section table{min-width:0;table-layout:fixed}#v1Section th,#v1Section td{white-space:normal;text-align:left}
    .strategy-card{padding:3px 0}.strategy-line{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}.strategy-line+.strategy-line{margin-top:7px;padding-top:7px;border-top:1px dashed #d7deea}
    .metric{display:flex;gap:5px;align-items:baseline;min-width:0;padding:4px 6px;border-radius:5px;background:#f7f9fc}.metric small{color:#687386;white-space:nowrap}.metric b{font-size:12px;white-space:nowrap}.primary-line .metric{background:#eef3ff}.metric-wide{flex:1 1 270px}.metric-medium{flex:1 1 165px}.metric-compact{flex:0 1 auto}
    #legacySection table{min-width:2450px}
    @media(max-width:700px){.top{position:relative}h2{font-size:16px}.wrap{padding:8px}.table{max-height:none}.strategy-line{gap:4px}.strategy-line+.strategy-line{margin-top:5px;padding-top:5px}.metric{padding:4px 5px;flex:1 1 145px}.metric-wide{flex-basis:100%}.metric-compact{flex-basis:auto}#legacySection table{min-width:2350px}}
  </style>
</head>
<body>
  <div class="top">
    <h2>Minute MA 연구·운영 Dashboard</h2>
    <div class="controls">
      <button class="scope active" data-scope="V1_LIVE">V1 LIVE 20</button>
      <button class="scope" data-scope="V1_ALL">V1 PAPER 2,400</button>
      <button class="scope" data-scope="LEGACY">기존 연구 8축</button>
      <label>기준일 <input id="asOf" type="date"></label>
      <label>기간 <select id="period"><option value="DAILY">일간</option><option value="WEEKLY">주간</option><option value="MONTHLY">월간</option><option value="ALL" selected>전체</option></select></label>
      <label>연구출처 <select id="source"><option value="COMBINED">통합 연구성과</option><option value="HISTORICAL_REPLAY">과거재생</option><option value="PAPER_FORWARD">PAPER</option></select></label>
      <select id="direction"><option value="">LONG/SHORT</option><option>LONG</option><option>SHORT</option></select>
      <input id="search" size="12" placeholder="전략/종목 검색">
      <select id="pageSize"><option>20</option><option>50</option></select>
      <button id="refresh">새로고침</button><span id="state" class="muted"></span>
    </div>
    <div id="legacyFilters" class="controls hidden">
      <select id="axis"><option value="">8축 전체</option><option>KRX_CONTINUOUS</option><option>KRX_RESET</option><option>INTEGRATED_CONTINUOUS</option><option>INTEGRATED_RESET</option><option>KRX_CONTINUOUS_AFTERNOON</option><option>KRX_RESET_AFTERNOON</option><option>INTEGRATED_CONTINUOUS_AFTERNOON</option><option>INTEGRATED_RESET_AFTERNOON</option></select>
      <select id="operation"><option value="">PAPER/LIVE 전체</option><option>LIVE</option><option>PAPER</option></select>
    </div>
    <div id="ops" class="cards"></div><div id="v1cards" class="cards"></div>
  </div>
  <div class="wrap">
    <p id="periodLabel" class="muted"></p>
    <section id="v1Section"><h3>V1 전략 성과</h3>
      <div class="table"><table><thead><tr><th>전략별 운영·성과 — 핵심 / 전략·연구 상세</th></tr></thead><tbody id="v1rows"></tbody></table></div>
    </section>
    <section id="legacySection" class="hidden"><h3>기존 연구 Strategy / Path</h3>
      <div id="legacyGate" class="collapsed">19,200개 연구경로는 펼친 뒤 서버 페이지 단위로만 조회합니다. <button id="loadLegacy">펼치기</button></div>
      <div id="legacyGrid" class="hidden table"><table><thead><tr>
        <th>path</th><th>축</th><th>전략</th><th>신호→실행</th><th>방향</th><th>진입 MA</th><th>청산 MA</th><th>추세</th><th>운영선정</th><th>운영</th>
        <th>가상 시작자본</th><th>기간 시작자본</th><th>기간 종료자본</th><th>기간 수익금</th><th>기간 복리수익률</th><th>완료/승/패</th><th>거래 승률</th><th>평균수익률</th><th>최대 단일손실</th><th>손절/정상청산</th><th><span class="help" title="각 기간에 완료된 거래의 복리수익률이 0%보다 큰 기간 수 / 집계 가능한 전체 기간 수">양수기간</span></th><th>Historical 전체 복리</th>
      </tr></thead><tbody id="legacyRows"></tbody></table></div>
    </section>
    <div class="pager"><button id="prev">이전</button><span id="pageInfo"></span><button id="next">다음</button></div>
  </div>
  <dialog id="detail"><header><button id="closeDetail">닫기</button> <b id="detailTitle"></b></header><section id="detailBody"></section></dialog>
  <script>
    const $=id=>document.getElementById(id);const state={scope:'V1_LIVE',page:1,totalPages:1,legacyLoaded:false,inflight:false,seq:0};
    function esc(v){return String(v??'해당없음').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function num(v,d=0){return v==null?'해당없음':Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}
    function won(v){return v==null?'해당없음':num(v,0)+'원'}function pct(v){if(v==null)return '해당없음';const n=Number(v);return (n>0?'+':'')+n.toFixed(2)+'%'}
    function cls(v){return v==null?'':Number(v)>0?'positive':Number(v)<0?'negative':''}function trend(v){return v==null?'추세필터 없음':'추세 MA'+v}
    function holding(v){return v==='HOLD_TO_NORMAL_EXIT_OR_STOP'?'정상 MA 청산 또는 손절까지 보유':esc(v)}
    function stop(v){return v==='UNDERLYING_1PCT'?'본주 +1% 손절':v==='UNDERLYING_5PCT'?'본주 -5% 손절':esc(v)}
    function recent(x){return '3거래 '+pct(x.recent_3_compound_pct)+' / 5거래 '+pct(x.recent_5_compound_pct)+' / 10거래 '+pct(x.recent_10_compound_pct)}
    function positive(x,prefix=''){const k=n=>x[prefix+n],part=(label,n)=>label+' '+num(k('positive_'+n+'_count'))+'/'+num(k('evaluable_'+n+'_count'))+' ('+pct(k('positive_'+n+'_pct'))+')';return part('일','day')+' · '+part('주','week')+' · '+part('월','month')}
    function provenance(x){return x?.length?x.join(' + '):'해당없음'}
    function metric(label,value,size='metric-compact',valueClass=''){return '<span class="metric '+size+'"><small>'+label+'</small><b class="'+valueClass+'">'+value+'</b></span>'}
    function detailTable(title,rows){if(!rows?.length)return '<h3>'+title+'</h3><div class="section-empty">현재 없음</div>';const keys=Object.keys(rows[0]);return '<h3>'+title+'</h3><div class="detail-table"><table><thead><tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
    async function showDetail(id){const r=await fetch('/minute-ma/api/detail?minute_path_id='+id,{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);$('detailTitle').textContent=d.path.path_key;$('detailBody').innerHTML=detailTable('PAPER 거래',d.paper_trades)+detailTable('LIVE 실제거래',d.live_trades)+detailTable('주문 흐름',d.orders)+detailTable('Broker 비용',d.broker_costs)+detailTable('복리자본 정산',d.settlements);$('detail').showModal()}
    function renderCommon(d){const o=d.operational;$('ops').innerHTML=[['기존 연구경로',o.total_paths],['미청산 PAPER',o.open_paper],['미청산 LIVE',o.open_live],['오늘 LIVE ENTRY/EXIT',o.today_live_entry+'/'+o.today_live_exit],['주문/체결',o.today_orders+'/'+o.today_filled_qty],['실주문 전송',o.send_enabled]].map(x=>'<span class="card '+(x[0]=='실주문 전송'?(x[1]=='Y'?'danger':'good'):'')+'"><b>'+x[0]+'</b> '+x[1]+'</span>').join('');const v=d.v1_summary;$('v1cards').innerHTML=[['V1 전체전략',v.policy_paths],['운영선정',v.selected_paths],['LIVE',v.live_paths],['실제 복리자본',won(v.strategy_compound_capital)],['미청산',v.open_trades],['익일 보유',v.overnight_open],['손절 종료수',v.stop_exits]].map(x=>'<span class="card"><b>'+x[0]+'</b> '+x[1]+'</span>').join('');$('periodLabel').textContent='성과기간 '+(d.period_from??'전체 시작')+' ~ '+d.period_to+' · 출처 '+({COMBINED:'과거재생 + PAPER',HISTORICAL_REPLAY:'과거재생',PAPER_FORWARD:'PAPER'}[d.performance_source]||d.performance_source)}
    function renderV1(rows){$('v1rows').innerHTML=rows.map(x=>{
      const primary=[
        metric('전략',esc(x.source_daily_strategy_id),'metric-compact'),metric('방향',esc(x.direction)),metric('신호→실행',esc(x.signal_code)+' → '+esc(x.execution_code),'metric-medium'),
        metric('Operation',esc(x.v1_operation_status),'metric-compact',x.v1_operation_status==='LIVE'?'live':''),metric('연구 기간자본',won(x.period_end_capital)+' · '+pct(x.period_compound_return_pct),'metric-medium',cls(x.period_compound_return_pct)),
        metric('LIVE_ACTUAL 복리자본',won(x.actual_current_capital)+' · '+pct(x.actual_compound_return_pct),'metric-medium',cls(x.actual_compound_return_pct)),metric('거래 완료/승/패',num(x.period_closed_trade_count)+'/'+num(x.period_win_count)+'/'+num(x.period_loss_count)),
        metric('승률',pct(x.period_win_rate_pct)),metric('양수기간',positive(x),'metric-wide'),metric('Rank(최근5)',esc(x.current_rank)),metric('기간 Rank',esc(x.period_rank))
      ].join('');
      const secondary=[
        metric('운영선정',esc(x.v1_selection_status)),metric('PAPER ENTRY',esc(x.paper_entry_start)+'~'+esc(x.paper_entry_end),'metric-medium'),metric('LIVE ENTRY',esc(x.live_entry_start)+'~'+esc(x.live_entry_end),'metric-medium'),metric('추세',trend(x.trend_ma)),
        metric('보유/청산정책',holding(x.holding_policy),'metric-wide'),metric('STOP',stop(x.stop_policy),'metric-medium'),metric('평균수익률',pct(x.period_avg_return_pct)),metric('최대 단일손실',pct(x.period_worst_trade_pct)),
        metric('손절/정상청산',num(x.period_stop_count)+'/'+num(x.period_normal_exit_count)),metric('연구성과출처',provenance(x.performance_provenance),'metric-wide'),metric('미청산/익일보유',num(x.total_open_count)+'/'+num(x.overnight_open_count)),
        metric('연구 가상/시작자본',won(x.virtual_initial_capital)+' / '+won(x.period_start_capital),'metric-medium'),metric('연구 기간수익금',won(x.period_compound_profit),'metric-medium',cls(x.period_compound_profit)),metric('최근 3/5/10 복리',recent(x),'metric-wide'),
        metric('LIVE 승인/시작자본',won(x.approved_amount)+' / '+won(x.actual_initial_capital),'metric-medium'),metric('LIVE 누적손익',won(x.actual_cumulative_pnl),'metric-medium',cls(x.actual_cumulative_pnl)),metric('LIVE 전체 완료/승률',num(x.actual_closed_trade_count)+' / '+pct(x.actual_win_rate_pct),'metric-medium'),
        metric('LIVE 기간 시작/종료',won(x.actual_period_start_capital)+' / '+won(x.actual_period_end_capital),'metric-wide'),metric('실제 기간 손익/실제 기간수익률',won(x.actual_period_pnl)+' / '+pct(x.actual_period_return_pct),'metric-medium',cls(x.actual_period_return_pct)),
        metric('LIVE 기간 완료/승/패',num(x.actual_period_closed_count)+'/'+num(x.actual_period_win_count)+'/'+num(x.actual_period_loss_count),'metric-medium'),metric('LIVE 기간 승률',pct(x.actual_period_win_rate_pct)),metric('LIVE 기간 평균/최악',pct(x.actual_period_avg_return_pct)+' / '+pct(x.actual_period_worst_trade_pct),'metric-medium'),
        metric('LIVE 손절/정상',num(x.actual_period_stop_count)+'/'+num(x.actual_period_normal_exit_count)),metric('LIVE 양수기간',positive(x,'actual_'),'metric-wide')
      ].join('');
      return '<tr><td><article class="strategy-card" data-policy-path="'+esc(x.policy_path_key)+'"><div class="strategy-line primary-line">'+primary+'</div><div class="strategy-line secondary-line">'+secondary+'</div></article></td></tr>'
    }).join('')}
    function renderLegacy(rows){$('legacyRows').innerHTML=rows.map(x=>'<tr><td class="link" data-detail="'+x.minute_path_id+'">'+esc(x.path_key)+'</td><td>'+esc(x.data_axis)+'</td><td>'+esc(x.source_daily_strategy_id)+'</td><td>'+esc(x.signal_code)+'→'+esc(x.execution_code)+'</td><td>'+esc(x.direction)+'</td><td>'+x.entry_fast_ma+'/'+x.entry_slow_ma+'</td><td>'+x.exit_fast_ma+'/'+x.exit_slow_ma+'</td><td>'+trend(x.trend_ma)+'</td><td>'+esc(x.selection_status)+'</td><td>'+esc(x.operation_status)+'</td><td>'+won(x.virtual_initial_capital)+'</td><td>'+won(x.period_start_capital)+'</td><td>'+won(x.period_end_capital)+'</td><td class="'+cls(x.period_compound_profit)+'">'+won(x.period_compound_profit)+'</td><td class="'+cls(x.period_compound_return_pct)+'">'+pct(x.period_compound_return_pct)+'</td><td>'+x.period_closed_trade_count+'/'+x.period_win_count+'/'+x.period_loss_count+'</td><td>'+pct(x.period_win_rate_pct)+'</td><td>'+pct(x.period_avg_return_pct)+'</td><td>'+pct(x.period_worst_trade_pct)+'</td><td>'+x.period_stop_count+'/'+x.period_normal_exit_count+'</td><td>'+positive(x)+'</td><td>'+pct(x.historical_compound_return_pct)+'</td></tr>').join('');document.querySelectorAll('[data-detail]').forEach(el=>el.onclick=()=>showDetail(el.dataset.detail))}
    async function load(){if(state.inflight||(state.scope==='LEGACY'&&!state.legacyLoaded))return;state.inflight=true;const seq=++state.seq,el=$('state');document.body.classList.add('loading');el.textContent='조회 중';try{const q=new URLSearchParams({scope:state.scope,page:state.page,page_size:$('pageSize').value,date:$('asOf').value,period:$('period').value,performance_source:$('source').value});if($('direction').value)q.set('direction',$('direction').value);if($('search').value.trim())q.set('search',$('search').value.trim());if(state.scope==='LEGACY'){if($('axis').value)q.set('axis',$('axis').value);if($('operation').value)q.set('operation',$('operation').value)}const r=await fetch('/minute-ma/api/dashboard?'+q,{cache:'no-store'}),d=await r.json();if(seq!==state.seq)return;if(!r.ok||d.status!=='OK')throw Error(d.error||'조회 실패');renderCommon(d);state.totalPages=d.total_pages;if(state.scope==='LEGACY')renderLegacy(d.rows);else renderV1(d.rows);$('pageInfo').textContent=d.page+' / '+d.total_pages+' · 전체 '+d.total_count.toLocaleString()+'개 · 현재 '+d.row_count+'개';$('prev').disabled=d.page<=1;$('next').disabled=d.page>=d.total_pages;el.textContent='완료 '+new Date().toLocaleTimeString()}catch(e){el.textContent=e.message;el.className='error'}finally{if(seq===state.seq){state.inflight=false;document.body.classList.remove('loading')}}}
    function setScope(scope){state.scope=scope;state.page=1;document.querySelectorAll('.scope').forEach(b=>b.classList.toggle('active',b.dataset.scope===scope));$('v1Section').classList.toggle('hidden',scope==='LEGACY');$('legacySection').classList.toggle('hidden',scope!=='LEGACY');$('legacyFilters').classList.toggle('hidden',scope!=='LEGACY');if(scope!=='LEGACY'||state.legacyLoaded)load()}
    $('asOf').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);document.querySelectorAll('.scope').forEach(b=>b.onclick=()=>setScope(b.dataset.scope));$('loadLegacy').onclick=()=>{state.legacyLoaded=true;$('legacyGate').classList.add('hidden');$('legacyGrid').classList.remove('hidden');load()};$('refresh').onclick=()=>load();['direction','pageSize','axis','operation','period','source','asOf'].forEach(id=>$(id).onchange=()=>{state.page=1;load()});$('search').onchange=()=>{state.page=1;load()};$('prev').onclick=()=>{if(state.page>1){state.page--;load()}};$('next').onclick=()=>{if(state.page<state.totalPages){state.page++;load()}};$('closeDetail').onclick=()=>$('detail').close();load();
  </script>
</body></html>
