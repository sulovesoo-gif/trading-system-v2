<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>분봉 MA 4축 Dashboard</title><style>
body{font:14px system-ui;margin:0;background:#f5f7fb;color:#172033}.top{position:sticky;top:0;background:white;padding:14px 18px;border-bottom:1px solid #dce2ec;z-index:2}.controls{display:flex;gap:8px;flex-wrap:wrap}.cards{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.card{background:#eef3ff;border-radius:8px;padding:8px 12px}.wrap{padding:0 18px 24px}.table{overflow:auto;background:white;border-radius:8px;max-height:75vh}table{border-collapse:collapse;min-width:1900px;width:100%}th,td{padding:7px 9px;border-bottom:1px solid #e5e9f0;white-space:nowrap;text-align:right}th{position:sticky;top:0;background:#1f3155;color:white}td:first-child,th:first-child{text-align:left}.robust{color:#08783e;font-weight:700}.muted{color:#687386}.error{color:#b42318}</style></head><body>
<div class="top"><h2>분봉 MA 병렬전략 4축</h2><div class="controls"><select id="axis"><option value="">4축 전체</option><option>KRX_CONTINUOUS</option><option>KRX_RESET</option><option>INTEGRATED_CONTINUOUS</option><option>INTEGRATED_RESET</option></select><select id="operation"><option value="">PAPER/LIVE 전체</option><option>LIVE</option><option>PAPER</option></select><button id="refresh">새로고침</button><span id="state" class="muted"></span></div><div id="cards" class="cards"></div></div>
<div class="wrap"><div class="table"><table><thead><tr><th>path</th><th>축</th><th>신호</th><th>실행</th><th>방향</th><th>진입 MA</th><th>청산 MA</th><th>Trend</th><th>Selection</th><th>ROBUST</th><th>운영</th><th>PAPER 거래</th><th>승률</th><th>평균 순수익</th><th>중앙 순수익</th><th>복리수익률</th><th>PAPER 자본</th><th>최대 OPEN</th><th>평균 보유분</th><th>MDD</th><th>LIVE 거래</th><th>LIVE 순손익</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>
const $=id=>document.getElementById(id),fmt=v=>v==null?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:4});
async function load(){const state=$('state');state.textContent='조회 중';try{const q=new URLSearchParams();if($('axis').value)q.set('axis',$('axis').value);if($('operation').value)q.set('operation',$('operation').value);const r=await fetch('/minute-ma/api/dashboard?'+q,{cache:'no-store'});const d=await r.json();if(!r.ok||d.status!=='OK')throw Error(d.error||'조회 실패');$('cards').innerHTML=d.summary.map(x=>`<span class="card"><b>${x.data_axis}</b> ${x.path_count.toLocaleString()} · SELECTED ${x.selected_count} · PENDING ${x.pending_count} · LIVE ${x.live_count}</span>`).join('');$('rows').innerHTML=d.rows.map(x=>`<tr><td>${x.path_key}</td><td>${x.data_axis}</td><td>${x.signal_code}</td><td>${x.execution_code}</td><td>${x.direction}</td><td>${x.entry_fast_ma}/${x.entry_slow_ma}</td><td>${x.exit_fast_ma}/${x.exit_slow_ma}</td><td>${x.trend_ma??'NONE'}</td><td>${x.selection_status}</td><td class="${x.robustness_yn==='Y'?'robust':''}">${x.robustness_yn}</td><td>${x.operation_status}</td><td>${x.paper_trade_count}</td><td>${fmt(x.win_rate_pct)}</td><td>${fmt(x.avg_net_return_pct)}</td><td>${fmt(x.median_net_return_pct)}</td><td>${fmt(x.compound_return_pct)}</td><td>${fmt(x.paper_compound_capital)}</td><td>${fmt(x.max_concurrent_open)}</td><td>${fmt(x.avg_hold_minutes)}</td><td>${fmt(x.mdd_pct)}</td><td>${x.live_trade_count}</td><td>${fmt(x.live_net_realized_pnl)}</td></tr>`).join('');state.textContent=`${d.row_count.toLocaleString()}개 · ${new Date().toLocaleTimeString()}`;}catch(e){state.textContent=e.message;state.className='error'}}
$('refresh').onclick=load;$('axis').onchange=load;$('operation').onchange=load;load();
</script></body></html>
