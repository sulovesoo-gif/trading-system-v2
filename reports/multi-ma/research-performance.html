const $=id=>document.getElementById(id), esc=v=>String(v??'--').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v==null?'--':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2}),won=v=>num(v)+' KRW',pct=v=>num(v)+'%';const decode=v=>{const e=document.createElement('span');e.innerHTML=v;return e.textContent};
function grid(id,specs,format){const table=$(id),cols=specs.map(x=>({field:x[0],label:decode(x[1]),sortType:x[2]}));table.querySelector('thead tr').innerHTML=cols.map(()=>'<th></th>').join('');let raw=[];const bound=ResearchGridSort.bind({table,columns:cols,rows:()=>raw,render:rows=>table.querySelector('tbody').innerHTML=rows.map((x,i)=>'<tr>'+format(x,i).map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')});return{set:rows=>{raw=rows||[];bound.draw()}}}

const daily=grid('dailyTable',dailySpecs,x=>[esc(x.trading_date),esc(x.trade_stock_label),esc(x.signal_source_label),esc(x.strategy_code),esc(x.observation_code),esc(x.direction),pct(x.daily_return_rate),esc(x.daily_market_direction),num(x.closed_count),pct(x.win_rate),won(x.gross_realized_profit),won(x.total_trading_cost),won(x.realized_profit),won(x.invested_amount),pct(x.invested_return_rate),pct(x.avg_trade_return_rate),num(x.avg_holding_seconds)]);
function query(){return new URLSearchParams({timeframe:'MINUTE',entry_condition:$('entry').value,analysis_session:$('session').value,start_date:$('start').value,end_date:$('end').value,trade_stock_code:$('trade').value||'ALL',signal_source_stock_code:$('source').value||'ALL',strategy_code:$('strategy').value,direction:$('direction').value,observation_code:'COMPLETE',rank_limit:'ALL'})}

function populateStocks(names){for(const id of ['trade','source']){const select=$(id),previous=select.value;select.innerHTML='<option value="ALL">ALL</option>'+Object.keys(names||{}).sort((a,b)=>ResearchGridSort.stockSortKey(a).localeCompare(ResearchGridSort.stockSortKey(b),'ko')).map(code=>'<option value="'+esc(code)+'">'+esc(ResearchGridSort.stockLabel(code))+'</option>').join('');select.value=previous||'ALL'}}
