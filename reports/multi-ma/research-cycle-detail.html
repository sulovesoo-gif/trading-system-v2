<!doctype html><html lang="ko"><meta charset="utf-8"><title>연구 cycle 상세</title><style>body{font-family:system-ui;padding:16px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccd5df;padding:5px;white-space:nowrap;text-align:right}th{background:#f2f5f8}td:first-child,th:first-child{text-align:left}</style><body><h1 id="title">연구 cycle 상세</h1><table><thead><tr><th>거래일</th><th>거래대상</th><th>신호원천</th><th>전략</th><th>방향</th><th>신호/확인/진입</th><th>진입가</th><th>청산</th><th>청산가</th><th>수량</th><th>실투입금</th><th>총손익</th><th>매수수수료</th><th>매도수수료</th><th>세금</th><th>총비용</th><th>순손익</th><th>1천만원 수익률</th></tr></thead><tbody id="rows"></tbody></table><script>const n=v=>v==null?'–':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2}),q=new URLSearchParams(location.search);fetch('/research/performance/cycles?'+q,{cache:'no-store'}).then(x=>x.json()).then(d=>{document.title='연구 cycle 상세 · '+(q.get('run_id')||'');document.getElementById('title').textContent='연구 cycle 상세 · '+(q.get('entry_condition')||'');document.getElementById('rows').innerHTML=(d.cycles||[]).map(x=>'<tr>'+[x.trading_date,x.trade_stock_code,x.signal_source_stock_code,x.strategy_code,x.direction,[x.entry_signal_time,x.entry_confirm_time,x.entry_time].join('<br>'),n(x.entry_price),x.exit_time,n(x.exit_price),n(x.quantity),n(x.invested_amount),n(x.gross_realized_profit),n(x.buy_fee),n(x.sell_fee),n(x.sell_tax),n(x.total_trading_cost),n(x.realized_profit),n(x.capital_return_rate)+'%'].map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="18">조회 결과 없음</td></tr>'})</script></body></html>
