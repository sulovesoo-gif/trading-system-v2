<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minute MA REAL PAPER</title><style>body{font:14px system-ui;margin:20px;background:#f4f7fb;color:#10233f}header,section{background:white;padding:16px;border-radius:12px;margin-bottom:14px}select,input{padding:8px;margin:4px}table{border-collapse:collapse;width:100%;min-width:1450px}th,td{padding:7px;border-bottom:1px solid #ddd;text-align:right}th:first-child,td:first-child{text-align:left}.wrap{overflow:auto}.yes{color:#08783e}</style></head>
<body><header><h1>Minute MA + REAL PAPER</h1><label>필터 <select id="filter"><option value="">전체</option><option>BASE</option><option>REAL_F1</option><option>REAL_F2</option><option>REAL_F3</option></select></label><label>정렬 <select id="sort"><option value="compound_cumulative_rank">복리 누적 순위</option><option value="compound_recent20_rank">복리 최근20일 순위</option><option value="compound_month_rank">복리 월 순위</option><option value="compound_week_rank">복리 주 순위</option><option value="compound_day_rank">복리 일 순위</option><option value="compound_cumulative_return">복리 누적 수익률</option><option value="fixed_cumulative_rank">고정 누적 순위</option><option value="fixed_cumulative_return">고정 누적 수익률</option></select></label><button id="load">조회</button><span id="status"></span></header><section class="wrap"><table><thead><tr><th>전략</th><th>종목</th><th>REAL</th><th>복리 현재자본</th><th>복리 누적손익/률</th><th>복리 일/주/월/20일/누적 Rank</th><th>고정 누적손익/률</th><th>고정 일/주/월/20일/누적 Rank</th><th>거래</th><th>복리/고정 평균순익</th><th>승률</th><th>복리/고정 MDD</th><th>후보/이유</th><th>과거출처</th></tr></thead><tbody id="rows"></tbody></table></section>
<script>const n=v=>Number(v||0).toLocaleString('ko-KR',{maximumFractionDigits:4});async function load(){status.textContent='조회 중';const q=new URLSearchParams({filter:filter.value,sort:sort.value,limit:'500'});const r=await fetch('/api/minute-ma-real?'+q);if(!r.ok)throw Error(r.status);const d=await r.json();rows.innerHTML=d.rows.map(x=>`<tr><td>${x.strategy_id}</td><td>${x.signal_code}</td><td>${x.filter_code}</td><td>${n(x.compound_current_capital)}</td><td>${n(x.compound_cumulative_profit)} / ${n(100*x.compound_cumulative_return)}%</td><td>${x.compound_day_rank}/${x.compound_week_rank}/${x.compound_month_rank}/${x.compound_recent20_rank}/${x.compound_cumulative_rank}</td><td>${n(x.fixed_cumulative_profit)} / ${n(100*x.fixed_cumulative_return)}%</td><td>${x.fixed_day_rank}/${x.fixed_week_rank}/${x.fixed_month_rank}/${x.fixed_recent20_rank}/${x.fixed_cumulative_rank}</td><td>${x.trade_count}</td><td>${n(x.compound_average_net_profit)} / ${n(x.fixed_average_net_profit)}</td><td>${n(100*x.win_rate)}%</td><td>${n(100*x.compound_max_drawdown)}% / ${n(100*x.fixed_max_drawdown)}%</td><td class="${x.current_candidate?'yes':''}">${x.current_candidate?'Y':'N'} ${(x.reasons||[]).join(', ')}</td><td>${x.legacy9_source?'기존9':''}${x.p1_source?' P1':''}</td></tr>`).join('');status.textContent=`${d.snapshot_date||'-'} · ${d.total}건`}document.querySelector('#load').onclick=()=>load().catch(e=>status.textContent='오류 '+e);load().catch(e=>status.textContent='오류 '+e)</script></body></html>
