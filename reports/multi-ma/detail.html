<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>분봉 상세</title><style>body{font-family:system-ui;margin:16px;color:#202832}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #d4dde5;padding:5px;white-space:nowrap;text-align:right}th{background:#f2f5f8}td:first-child,th:first-child{text-align:left}.muted{color:#647180}.bad{color:#bd2020}@media(max-width:700px){body{margin:8px}table{font-size:10px}}</style><body><h1 id="title">분봉 상세</h1><p id="meta" class="muted">불러오는 중…</p><p><button id="prev">이전 분</button> <button id="next">다음 분</button> <button id="refresh">새로고침</button> <button onclick="close()">닫기</button></p><h2>공식 분봉</h2><div id="official"></div><h2>Observation</h2><table><thead><tr><th>OBS</th><th>관측 시각</th><th>가격</th><th>MA3</th><th>MA5</th><th>MA10</th><th>공식 종가 대비</th><th>S1/S2/S3</th><th>canonical</th><th>cycle</th></tr></thead><tbody id="obs"></tbody></table><h2>프로그램 수급</h2><pre id="program" class="muted"></pre><h2>체결강도</h2><pre id="execution" class="muted"></pre><script>
const qs=new URLSearchParams(location.search),n=v=>v==null?'–':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2}),tm=v=>String(v||'').slice(0,16),OBS=['SEC_05','SEC_10','SEC_15','SEC_20','SEC_25','SEC_30','SEC_35','SEC_40','SEC_45','SEC_50','SEC_55','COMPLETE'];let data;
function selected(){return (data?.minute_details||[]).find(x=>String(x.bar_time).slice(0,16)===String(qs.get('minuteTime')).slice(0,16))}function move(delta){let t=new Date(qs.get('minuteTime'));t.setMinutes(t.getMinutes()+delta);qs.set('minuteTime',t.toISOString().slice(0,16)+':00');history.replaceState(null,'','?'+qs);load()}
function load(){fetch('./data/latest.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{data=x;let d=selected(),trade=qs.get('tradeStockCode')||'000660',source=qs.get('signalSourceStockCode')||trade;document.title=`${trade} · ${tm(qs.get('minuteTime'))}`;$('title').textContent=document.title;$('meta').textContent=`거래 대상: ${trade} · 신호 원천: ${source===trade?'자기 종목':source} · 선택 시각: ${tm(qs.get('minuteTime'))}`;if(!d){$('official').textContent='DATA_MISSING';$('obs').innerHTML='';return}let o=d.official||{},close=+o.close_price;$('official').textContent=`공식 ${tm(d.bar_time)} · O/H/L/C/V ${n(o.open_price)} / ${n(o.high_price)} / ${n(o.low_price)} / ${n(o.close_price)} / ${n(o.volume)} · COMPLETE MA3/5/10 ${n(o.ma_short)} / ${n(o.ma_mid)} / ${n(o.ma_long)}`;$('obs').innerHTML=OBS.map(code=>{let r=d.observations?.[code];if(!r)return `<tr><td>${code}</td><td colspan="9">DATA_MISSING</td></tr>`;let cmp=r.close_price>close?'HIGH':r.close_price<close?'LOW':'SAME',s=(r.canonical_signals||[]).map(v=>v.signal_no+' '+v.direction).join(', ')||'-';return `<tr><td>${code}</td><td>${tm(r.observation_time)}</td><td>${n(r.close_price)}</td><td>${n(r.ma_short)}</td><td>${n(r.ma_mid)}</td><td>${n(r.ma_long)}</td><td>${cmp}</td><td>${s}</td><td>${s==='-'?'N':'Y'}</td><td>-</td></tr>`}).join('');$('program').textContent=JSON.stringify(d.program||{status:'DATA_MISSING'},null,2);$('execution').textContent=JSON.stringify(d.execution_strength||{status:'DATA_MISSING'},null,2)})}
const $=id=>document.getElementById(id);$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('refresh').onclick=load;load();
</script></body></html>
