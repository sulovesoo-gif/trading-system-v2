<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading V2 Multi MA</title>
<style>
body{font:14px system-ui;margin:16px auto;max-width:1560px;color:#202832;background:#f2f5f8;padding:14px}.card,.chart,section{background:#fff;border:1px solid #cdd7e1;border-radius:8px;padding:10px;margin:8px 0}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.chart svg{width:100%;height:340px;min-width:800px}.thin svg{height:76px}.thin{min-height:24px}.scroll{overflow:auto}.performance{height:310px;overflow:auto}.performance th{position:sticky;top:0;background:#eef3f7}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #d4dde5;padding:5px;white-space:nowrap;text-align:right}th{background:#eef3f7}button,select{padding:4px}#error{color:#b00020}#detail{font-size:12px}.price{stroke:#1565c0}.ma3{stroke:#db3d57}.ma5{stroke:#16803f}.ma10{stroke:#a46800}.muted{color:#687784}@media(max-width:700px){body{margin:0;padding:6px}.chart svg{min-width:640px;height:270px}}
</style><body>
<h1>Trading System V2 · Multi MA</h1><div id="status" class="card"></div><div id="error"></div>
<div class="controls card"><label>Strategy <select id="strategy"></select></label><label>Observation <select id="observation"></select></label><label>Direction <select id="direction"><option>ALL</option><option>LONG</option><option>SHORT</option></select></label><label>Session <select id="session"><option value="ALL_INTEGRATED">All 08:00-20:00</option><option value="REGULAR">Regular 09:00-15:19</option><option value="NXT_PRE">NXT pre 08:00-08:49</option><option value="NXT_AFTER">NXT after 15:40-19:59</option></select></label><label>Window <select id="window"><option>30</option><option selected>50</option><option>90</option><option value="0">All</option></select><button id="prev">Previous</button><button id="next">Next</button><button id="latest">Latest</button><span id="windowInfo"></span></div>
<section><h2>Main price / MA</h2><label><input type="checkbox" id="programToggle" checked> Program net (KRW 100m)</label><span id="programNote" class="muted"></span><div class="chart"><svg id="main" viewBox="0 0 1100 340"></svg></div><div id="programBars" class="thin muted"></div><div id="strength" class="thin muted"></div></section>
<section id="detail">Click a minute slot for details.</section>
<section><h2>Trade result</h2><div class="chart"><svg id="tradesChart" viewBox="0 0 1100 250"></svg></div></section>
<section><h2>Observation performance</h2><p id="aggregate" class="muted"></p><div class="performance"><table><thead id="performanceHead"></thead><tbody id="performanceBody"></tbody></table></div></section>
<section><h2>Trade detail</h2><div class="scroll"><table><thead><tr><th>cycle</th><th>strategy</th><th>observation</th><th>direction</th><th>entry</th><th>exit</th><th>profit</th><th>exit type</th></tr></thead><tbody id="tradeBody"></tbody></table></div><div class="controls"><label>per page <select id="pageSize"><option>10</option><option selected>20</option><option>50</option></select></label><button id="pagePrev">Previous</button><span id="pageInfo"></span><button id="pageNext">Next</button></div></section>
<script>
const OBS=['SEC_05','SEC_10','SEC_15','SEC_20','SEC_25','SEC_30','SEC_35','SEC_40','SEC_45','SEC_50','SEC_55','COMPLETE'],STR=['SIGNAL_1','SIGNAL_2','SIGNAL_3','ACCUMULATED'],CAPITAL=10000000;
const $=id=>document.getElementById(id),num=v=>v==null?'-':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2}),stamp=v=>String(v||'').slice(0,16),time=v=>String(v||'').slice(11,16),asDate=v=>new Date(v),arrays=['programMinuteSeries','executionStrengthSeries','main_completed_series','minute_details','summaries','signals','trades','trade_legs','states'];
let data={},strategy='SIGNAL_1',observation='COMPLETE',direction='ALL',session='ALL_INTEGRATED',start=0,page=1,pageSize=20,selected=null;
function normalize(input){data=input&&typeof input==='object'?input:{};for(const k of arrays)if(!Array.isArray(data[k]))data[k]=[];data.programStatus=data.programStatus|| (data.programMinuteSeries.length?'NORMAL':'DATA_MISSING');data.executionStrengthStatus=data.executionStrengthStatus||(data.executionStrengthSeries.length?'NORMAL':'DATA_MISSING')}
function inSession(v){let d=asDate(v),m=d.getHours()*60+d.getMinutes();if(session==='ALL_INTEGRATED')return(480<=m&&m<530)||(540<=m&&m<920)||(940<=m&&m<1200);if(session==='REGULAR')return 540<=m&&m<920;if(session==='NXT_PRE')return 480<=m&&m<530;return 940<=m&&m<1200}
function mainPoints(){let a=data.main_completed_series.filter(x=>inSession(x.timestamp));if(observation!=='COMPLETE'){let c=(data.current_observations||{})[observation];if(c&&inSession(c.target_bar_time)){let v=a.map(x=>+x.price).concat(+c.price),avg=n=>v.length<n?null:v.slice(-n).reduce((x,y)=>x+y,0)/n;a.push({timestamp:c.target_bar_time,price:c.price,ma_short:avg(3),ma_mid:avg(5),ma_long:avg(10)})}}return a}
function slots(){let p=mainPoints(),map=new Map(p.map(x=>[stamp(x.timestamp),x]));return [...map.keys()].sort().map((k,i)=>({i,time:k+':00',point:map.get(k)}))}
function visible(){let a=slots(),size=+$('window').value||a.length;start=Math.max(0,Math.min(start,Math.max(0,a.length-size)));return a.slice(start,start+size)}
function filteredTrades(){return data.trades.filter(t=>(direction==='ALL'||t.direction===direction)&&inSession(t.entry_time)&&(!t.exit_time||inSession(t.exit_time))).sort((a,b)=>+asDate(b.entry_time)-+asDate(a.entry_time))}
function xFor(i,n){return 54+i*1026/Math.max(1,n-1)}
function drawMain(){let a=visible(),svg=$('main');if(!a.length){svg.innerHTML='<text x="20" y="30">No price data</text>';return}let vals=a.flatMap(s=>s.point?[s.point.price,s.point.ma_short,s.point.ma_mid,s.point.ma_long]:[]).filter(v=>v!=null).map(Number),lo=Math.min(...vals),hi=Math.max(...vals),pad=Math.max(1,(hi-lo)*.08),y=v=>312-(v-(lo-pad))*286/(hi-lo+2*pad),path=k=>a.map((s,i)=>s.point?.[k]==null?'':`${i?'L':'M'}${xFor(i,a.length)},${y(+s.point[k])}`).join(' '),grid=a.map((s,i)=>`<line x1="${xFor(i,a.length)}" x2="${xFor(i,a.length)}" y1="18" y2="312" stroke="#edf1f4"/>`).join(''),sel=selected?`<line x1="${xFor(a.findIndex(s=>stamp(s.time)===stamp(selected)),a.length)}" x2="${xFor(a.findIndex(s=>stamp(s.time)===stamp(selected)),a.length)}" y1="18" y2="312" stroke="#285fa8"/>`:'';svg.innerHTML=grid+`<path d="${path('price')}" class="price" fill="none" stroke-width="2"/><path d="${path('ma_short')}" class="ma3" fill="none" stroke-width="2"/><path d="${path('ma_mid')}" class="ma5" fill="none" stroke-width="2"/><path d="${path('ma_long')}" class="ma10" fill="none" stroke-width="2"/>`+sel;svg.onclick=e=>{let r=svg.getBoundingClientRect(),i=Math.round((e.clientX-r.left)*1100/r.width-54)*Math.max(1,a.length-1)/1026;selected=a[Math.max(0,Math.min(a.length-1,Math.round(i)))].time;render()};drawProgram(a);drawStrength(a)}
function seriesMap(name){return new Map(data[name].map(x=>[stamp(x.minute_time),x]))}
function drawProgram(a){let map=seriesMap('programMinuteSeries'),rows=a.map(s=>map.get(stamp(s.time))),valid=rows.filter(Boolean),bar=$('programBars');$('programNote').textContent=valid.length?'':' Program data missing today';if(!$('programToggle').checked||!valid.length){bar.textContent=valid.length?'Program display off':'Today program flow data is unavailable';return}let ds=rows.map(x=>x?.minute_net_buy_amount).filter(v=>v!=null),lo=Math.min(0,...ds),hi=Math.max(0,...ds),y=v=>68-(v-lo)*54/(hi-lo||1),z=y(0),w=Math.max(2,1026/a.length*.7),body=`<svg viewBox="0 0 1100 84"><line x1="54" x2="1080" y1="${z}" y2="${z}" stroke="#888"/>`;rows.forEach((r,i)=>{if(r?.minute_net_buy_amount==null)return;let yy=y(+r.minute_net_buy_amount);body+=`<rect x="${xFor(i,a.length)-w/2}" y="${Math.min(yy,z)}" width="${w}" height="${Math.max(1,Math.abs(yy-z))}" fill="${r.minute_net_buy_amount>=0?'#16803f':'#d83232'}"/>`});bar.innerHTML=body+'</svg>'}
function drawStrength(a){let map=seriesMap('executionStrengthSeries'),rows=a.map(s=>map.get(stamp(s.time))),valid=rows.filter(x=>x?.execution_strength!=null),box=$('strength');if(!valid.length){box.textContent='Today execution strength data is unavailable';return}let v=valid.map(x=>+x.execution_strength),lo=Math.min(100,...v),hi=Math.max(100,...v),y=x=>68-(x-lo)*54/(hi-lo||1),path='',on=false;rows.forEach((r,i)=>{if(r?.execution_strength==null){on=false;return}path+=(on?'L':'M')+xFor(i,a.length)+','+y(+r.execution_strength);on=true});box.innerHTML=`<svg viewBox="0 0 1100 84"><line x1="54" x2="1080" y1="${y(100)}" y2="${y(100)}" stroke="#888"/><path d="${path}" stroke="#b64b00" fill="none" stroke-width="2"/><text x="5" y="${y(100)}">100</text></svg>`}
function detail(){let d=data.minute_details.find(x=>stamp(x.bar_time)===stamp(selected));if(!d){$('detail').textContent=selected?'DATA_MISSING':'Click a minute slot for details.';return}let p=d.program||{},e=d.execution_strength||{};$('detail').textContent=`Selected ${time(selected)} | Program: ${p.status||'DATA_MISSING'} ${num(p.cumulative_net_buy_amount)} | Execution strength: ${e.status||'DATA_MISSING'} ${num(e.execution_strength)} | volume ${num(e.execution_volume)}`}
const C=[['rank','Rank'],['ob','Observation'],['st','Strategy'],['total','Total'],['open','Open'],['closed','Closed'],['wl','Win/Loss'],['wr','Win rate'],['p','Profit'],['ir','Invested return'],['cr','10m return'],['ar','Average return'],['hold','Average hold'],['sp','Signal exit'],['cp','Session close']];
function legs(t){return data.trade_legs.filter(x=>String(x.trade_id)===String(t.trade_id))}function investment(t){let l=legs(t);return l.length?l.reduce((v,x)=>v+(+x.notional_amount||0),0):Math.floor(CAPITAL*(+t.entry_ratio||1)/(+t.entry_price||1))*(+t.entry_price||0)}
function rows(){return STR.flatMap(st=>OBS.map(ob=>{let ts=filteredTrades().filter(t=>t.strategy_code===st&&t.observation_code===ob),cl=ts.filter(t=>t.status==='CLOSED'),p=cl.reduce((v,t)=>v+(+t.realized_profit_amount||0),0),inv=cl.reduce((v,t)=>v+investment(t),0),win=cl.filter(t=>+t.realized_profit_amount>0).length,loss=cl.filter(t=>+t.realized_profit_amount<0).length,rates=cl.map(t=>(+t.realized_profit_amount||0)/Math.max(1,investment(t))*100),hold=cl.map(t=>(+asDate(t.exit_time)-+asDate(t.entry_time))/60000);return{ob,st,total:ts.length,open:ts.length-cl.length,closed:cl.length,wl:`${win}/${loss}`,wr:cl.length?win/cl.length*100:null,p,ir:inv?p/inv*100:null,cr:p/CAPITAL*100,ar:rates.length?rates.reduce((a,b)=>a+b,0)/rates.length:null,hold:hold.length?hold.reduce((a,b)=>a+b,0)/hold.length:null,sp:cl.filter(t=>t.exit_type==='SIGNAL').reduce((v,t)=>v+(+t.realized_profit_amount||0),0),cp:cl.filter(t=>t.exit_type==='SESSION_CLOSE').reduce((v,t)=>v+(+t.realized_profit_amount||0),0)}})).sort((a,b)=>b.cr-a.cr)}
function val(k,v){if(['wr','ir','cr','ar'].includes(k))return v==null?'-':num(v)+'%';if(['p','sp','cp'].includes(k))return num(v)+' KRW';if(k==='hold')return v==null?'-':`${Math.floor(v/60)}:${String(Math.round(v%60)).padStart(2,'0')}`;return v??'-'}
function performance(){let r=rows();$('performanceHead').innerHTML='<tr>'+C.map(x=>`<th>${x[1]}</th>`).join('')+'</tr>';$('performanceBody').innerHTML=r.map((x,i)=>'<tr>'+C.map(([k])=>`<td>${val(k,k==='rank'?i+1:x[k])}</td>`).join('')+'</tr>').join('');$('aggregate').textContent=`Direction: ${direction} · closed: ${r.reduce((v,x)=>v+x.closed,0)} · combinations: ${r.length}`}
function tradeTable(){let t=filteredTrades(),pages=Math.max(1,Math.ceil(t.length/pageSize));page=Math.min(page,pages);let subset=t.slice((page-1)*pageSize,page*pageSize);$('tradeBody').innerHTML=subset.map(x=>`<tr><td>${x.cycle_no}</td><td>${x.strategy_code}</td><td>${x.observation_code}</td><td>${x.direction}</td><td>${stamp(x.entry_time)} ${num(x.entry_price)}</td><td>${stamp(x.exit_time)||'OPEN'} ${num(x.exit_price)}</td><td>${num(x.realized_profit_amount)}</td><td>${x.exit_type||'OPEN'}</td></tr>`).join('')||'<tr><td colspan="8">No trades</td></tr>';$('pageInfo').textContent=`${t.length?((page-1)*pageSize+1)+'-'+Math.min(t.length,page*pageSize):0} / ${t.length} · ${page}/${pages}`;$('pagePrev').disabled=page===1;$('pageNext').disabled=page===pages}
function drawTrades(){let a=visible(),t=filteredTrades().filter(x=>a.some(s=>stamp(s.time)===stamp(x.entry_time)||stamp(s.time)===stamp(x.exit_time))),svg=$('tradesChart');if(!t.length){svg.innerHTML='<text x="20" y="30">No trades in visible window</text>';return}let values=t.flatMap(x=>[+x.entry_price,+x.exit_price||+x.entry_price]),lo=Math.min(...values),hi=Math.max(...values),y=v=>220-(v-lo)*190/(hi-lo||1),index=v=>a.findIndex(s=>stamp(s.time)===stamp(v)),body='';t.forEach(x=>{let i=index(x.entry_time),j=index(x.exit_time||x.entry_time);if(i<0)return;body+=`<line x1="${xFor(i,a.length)}" y1="${y(+x.entry_price)}" x2="${xFor(j<0?i:j,a.length)}" y2="${y(+(x.exit_price||x.entry_price))}" stroke="${x.direction==='LONG'?'#16803f':'#d83232'}" stroke-width="2"/>`});svg.innerHTML=body}
function render(){$('error').textContent='';drawMain();detail();drawTrades();performance();tradeTable();$('status').textContent=`${data.market_status||'OPEN_OR_IDLE'} · program ${data.programStatus} · execution ${data.executionStrengthStatus}`}
function init(){for(let [id,vs] of [['strategy',STR],['observation',OBS]]){$(id).innerHTML=vs.map(v=>`<option>${v}</option>`).join('')}$('strategy').onchange=e=>{strategy=e.target.value;page=1;render()};$('observation').onchange=e=>{observation=e.target.value;render()};$('direction').onchange=e=>{direction=e.target.value;page=1;render()};$('session').onchange=e=>{session=e.target.value;start=0;page=1;render()};$('window').onchange=()=>{start=0;render()};$('prev').onclick=()=>{start=Math.max(0,start-(+$('window').value||50));render()};$('next').onclick=()=>{start+=+$('window').value||50;render()};$('latest').onclick=()=>{start=Math.max(0,slots().length-(+$('window').value||50));render()};$('pageSize').onchange=e=>{pageSize=+e.target.value;page=1;render()};$('pagePrev').onclick=()=>{page--;render()};$('pageNext').onclick=()=>{page++;render()};$('programToggle').onchange=render}
async function poll(){let r=await fetch('./data/latest.json?ts='+Date.now(),{cache:'no-store'}),j=await r.json();normalize(j);render();setTimeout(poll,5000)}init();poll();
</script></body></html>
