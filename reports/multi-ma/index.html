<!doctype html><meta charset="utf-8"><title>Trading System V2 · Multi MA</title>
<style>body{font:14px system-ui;margin:20px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:5px}.warn{color:#b00}.ok{color:#067a25}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid #bbb;padding:10px;min-height:100px}</style>
<h1>Trading System V2 · 다중 MA</h1><p id=status>데이터 로딩 중…</p><p>전략 알림 <b>OFF</b> · 실제 주문 <b>OFF</b></p>
<h2>48개 성과</h2><table><thead><tr><th>전략</th><th>기준</th><th>포지션</th><th>비중</th><th>손익</th><th>수익률</th><th>거래</th><th>SIGNAL</th><th>SESSION_CLOSE</th></tr></thead><tbody id=summary></tbody></table>
<h2>그래프</h2><div class=grid><div class=card>SIGNAL_1<br><pre id=g1></pre></div><div class=card>SIGNAL_2<br><pre id=g2></pre></div><div class=card>SIGNAL_3<br><pre id=g3></pre></div><div class=card>ACCUMULATED<br><pre id=g4></pre></div></div>
<h2>최근 거래 상세</h2><table><thead><tr><th>시각</th><th>방향</th><th>기준</th><th>진입</th><th>비중</th><th>청산</th><th>EXIT</th><th>손익</th></tr></thead><tbody id=trades></tbody></table>
<script>
let last='';const by=id=>document.getElementById(id);const esc=v=>String(v??'');
function render(d){const now=Date.now(), generated=new Date(d.generated_at).getTime(),age=Math.max(0,(now-generated)/1000);let cls=age>30?'warn':age>15?'warn':'ok';by('status').innerHTML=`<b class="${cls}">${d.market_status}</b> · 마지막 데이터 ${esc(d.generated_at)} · 지연 ${age.toFixed(0)}초 · 완료봉 ${esc(d.latest_completed?.bar_time||'없음')} · 스냅샷 ${esc(d.latest_snapshot?.snapshot_time||'없음')}`;
 const states=Object.fromEntries(d.states.map(x=>[x.strategy_code+'|'+x.observation_code,x]));by('summary').innerHTML=d.summaries.map(x=>{let s=states[x.strategy_code+'|'+x.observation_code]||{};return `<tr><td>${x.strategy_code}</td><td>${x.observation_code}</td><td>${s.position_direction||'FLAT'}</td><td>${s.position_weight||0}</td><td>${x.total_profit_amount}</td><td>${x.total_profit_rate}</td><td>${x.trade_count}</td><td>${x.signal_exit_profit}</td><td>${x.session_close_exit_profit}</td></tr>`}).join('')||'<tr><td colspan=9>아직 거래일 데이터 없음</td></tr>';
 by('trades').innerHTML=d.trades.map(x=>`<tr><td>${esc(x.entry_time)}</td><td>${x.direction}</td><td>${x.observation_code}</td><td>${x.entry_price}</td><td>${x.entry_ratio}</td><td>${esc(x.exit_price)}</td><td>${esc(x.exit_type)} / ${esc(x.exit_reason)}</td><td>${esc(x.realized_profit_amount)}</td></tr>`).join('')||'<tr><td colspan=8>아직 거래 없음</td></tr>';
 ['SIGNAL_1','SIGNAL_2','SIGNAL_3','ACCUMULATED'].forEach((s,i)=>by('g'+(i+1)).textContent=(d.signals.filter(x=>x.strategy_code===s).slice(0,12).map(x=>`${x.signal_time} ${x.direction} ${x.signal_no}`).join('\n')||'아직 신호 없음'))}
async function poll(){try{let r=await fetch('data/latest.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);let t=await r.text();if(t!==last){last=t;render(JSON.parse(t))}}catch(e){by('status').textContent='데이터 조회 실패: '+e}setTimeout(poll,5000)}poll();
</script>
