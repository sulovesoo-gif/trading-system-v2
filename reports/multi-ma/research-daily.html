<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Research COMPLETE</title>
<style>:root{font-family:system-ui,sans-serif;color:#1f2937;background:#eef2f6}body{max-width:1680px;margin:16px auto;padding:18px;background:#fff;border-radius:10px}.controls,.summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}label{font-size:.9rem}input,select,button{padding:6px;border:1px solid #9eabb9;border-radius:5px;background:#fff}.summary div{border:1px solid #d6dee7;border-radius:7px;padding:8px;min-width:145px}table{border-collapse:collapse;width:100%;font-size:.8rem}th,td{padding:6px;border:1px solid #d5dde5;white-space:nowrap;text-align:right}th{background:#f2f5f8}td:first-child,th:first-child{text-align:left}.scroll{max-height:430px;overflow:auto;border:1px solid #d5dde5}.scroll th{position:sticky;top:0}.muted{color:#64748b}.open{color:#a16207}@media(max-width:700px){body{margin:0;padding:10px;border-radius:0}table{font-size:.72rem}}</style>
<body><h1>&#51068;&#48393; &#50672;&#44396; &middot; COMPLETE</h1><p class="muted">&#51200;&#51109;&#46108; &#44277;&#49885; &#51068;&#48393; RAW&#47564; &#49324;&#50857;&#54633;&#45768;&#45796;. &#51312;&#54924;&#45716; &#51069;&#44592; &#51204;&#50857;&#51077;&#45768;&#45796;.</p>
<div class="controls"><label>&#49884;&#51089;&#51068; <input id="start" type="date"></label><label>&#51333;&#47308;&#51068; <input id="end" type="date"></label><label>MA <input id="period" type="number" min="1" step="1" value="10"></label><label>&#51652;&#51077; <select id="condition"><option value="MA_CONFIRM">MA &#54869;&#51064;</option><option value="SIGNAL_ONLY">SIGNAL_ONLY</option></select></label><label>&#44144;&#47000; &#45824;&#49345; <input id="trade" placeholder="ALL"></label><label>&#49888;&#54840; &#50896;&#52404; <input id="source" placeholder="ALL"></label><label>&#51204;&#47029; <select id="strategy"><option value="ALL">ALL</option><option>SIGNAL_1</option><option>SIGNAL_2</option><option>SIGNAL_3</option><option>ACCUMULATED</option><option>ACCUMULATED_1</option><option>ACCUMULATED_2</option></select></label><label>&#48169;&#54693; <select id="direction"><option value="ALL">LONG+SHORT</option><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select></label><button id="load">&#51312;&#54924;</button></div>
<p id="run" class="muted"></p><div id="summary" class="summary"></div><h2>&#44592;&#44036; &#51204;&#47029; &#49692;&#50948;</h2><div class="scroll"><table><thead><tr><th>#</th><th>&#44144;&#47000;&#45824;&#49345;</th><th>&#49888;&#54840;&#50896;&#52404;</th><th>&#51204;&#47029;</th><th>&#48169;&#54693;</th><th>CLOSED</th><th>&#49849;/&#54056;/&#48372;&#54633;</th><th>&#48708;&#50857; &#51204; &#49552;&#51061;</th><th>&#48708;&#50857;</th><th>&#49692;&#49552;&#51061;</th><th>&#49892;&#53804;&#51077;&#44552;</th><th>&#49688;&#51061;&#47456;</th><th>&#54217;&#44512; &#48372;&#50976;&#51068;</th></tr></thead><tbody id="ranking"></tbody></table></div>
<h2>&#51068;&#48324; &#49457;&#44284;</h2><div class="scroll"><table><thead><tr><th>&#44144;&#47000;&#51068;</th><th>&#44144;&#47000;&#45824;&#49345;</th><th>&#49888;&#54840;&#50896;&#52404;</th><th>&#51204;&#47029;</th><th>&#48169;&#54693;</th><th>CLOSED</th><th>&#49849;&#47456;</th><th>&#48708;&#50857; &#51204; &#49552;&#51061;</th><th>&#48708;&#50857;</th><th>&#49692;&#49552;&#51061;</th><th>&#49688;&#51061;&#47456;</th><th>&#54217;&#44512; &#48372;&#50976;&#51068;</th></tr></thead><tbody id="daily"></tbody></table></div><h2>OPEN</h2><p id="open" class="open">OPEN mark-to-market records are shown when a daily run retains a position.</p>
<script>
const $=id=>document.getElementById(id),num=v=>v==null?'--':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2}),won=v=>`${num(v)} KRW`,pct=v=>`${num(v)}%`,esc=v=>String(v??'--').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const row=v=>`<tr>${v.map(x=>`<td>${x}</td>`).join('')}</tr>`;
const query=()=>new URLSearchParams({start_date:$('start').value,end_date:$('end').value,entry_condition:$('condition').value,ma_period:$('period').value,trade_stock_code:$('trade').value||'ALL',signal_source_stock_code:$('source').value||'ALL',strategy_code:$('strategy').value,direction:$('direction').value,observation_code:'COMPLETE'});
function cards(s){const v=[['CLOSED',s.closed_count],['W/L/F',`${s.win_count}/${s.loss_count}/${s.flat_count}`],['Win rate',pct(s.win_rate)],['Target capital',won(s.target_capital)],['Invested',won(s.invested_amount)],['Gross P/L',won(s.gross_realized_profit)],['Cost',won(s.total_trading_cost)],['Net P/L',won(s.realized_profit)],['Net return',pct(s.invested_return_rate)],['Avg return',pct(s.avg_trade_return_rate)],['Avg holding',`${num(Number(s.avg_holding_seconds)/86400)} d`]];$('summary').innerHTML=v.map(([a,b])=>`<div><b>${a}</b><br>${b}</div>`).join('')}
async function load(){const period=Number($('period').value);if(!Number.isInteger(period)||period<1){$('run').textContent='MA period must be a positive integer.';return}const r=await fetch(`/research/daily/api?${query()}`,{cache:'no-store'}),d=await r.json();if(d.status!=='OK'){$('run').textContent=d.error||'No matching completed run.';$('summary').innerHTML='';$('ranking').innerHTML='';$('daily').innerHTML='';return}if(!$('start').value)$('start').value=d.selected_start_date||d.start_date;if(!$('end').value)$('end').value=d.selected_end_date||d.end_date;$('run').textContent=`run ${d.run_id} | ${d.selected_start_date||d.start_date} ~ ${d.selected_end_date||d.end_date} | COMPLETE | ${d.entry_condition} | MA ${d.parameters?.ma_period??$('period').value}`;cards(d.summary);$('ranking').innerHTML=d.ranking.map((x,i)=>row([i+1,esc(x.trade_stock_code),esc(x.signal_source_stock_code),esc(x.strategy_code),esc(x.direction),x.closed_count,`${x.win_count}/${x.loss_count}/${x.flat_count}`,won(x.gross_realized_profit),won(x.total_trading_cost),won(x.realized_profit),won(x.invested_amount),pct(x.invested_return_rate),`${num(Number(x.avg_holding_seconds)/86400)} d`])).join('');$('daily').innerHTML=d.daily.map(x=>row([esc(x.trading_date),esc(x.trade_stock_code),esc(x.signal_source_stock_code),esc(x.strategy_code),esc(x.direction),x.closed_count,pct(x.win_rate),won(x.gross_realized_profit),won(x.total_trading_cost),won(x.realized_profit),pct(x.invested_return_rate),`${num(Number(x.avg_holding_seconds)/86400)} d`])).join('')}
$('load').onclick=load;load();
</script></body></html>
